version: 2

models:

  - name: stg_results
    description: >
      Staged Formula 1 race results.
      Grain: one driver per race.

    columns:

      - name: season
        description: Formula 1 season.
        tests:
          - not_null

      - name: round
        description: Championship round number.
        tests:
          - not_null

      - name: driver_id
        description: FastF1 driver identifier.
        tests:
          - not_null

      - name: driver_code
        description: Three-letter driver abbreviation.
        tests:
          - not_null

      - name: driver_number
        description: Driver racing number.

      - name: team_id
        description: Team identifier.

      - name: team_name
        description: Team name.
        tests:
          - not_null

      - name: grid_position
        description: Driver starting grid position.

      - name: finish_position
        description: Final race finishing position.

      - name: points
        description: Championship points awarded.
        tests:
          - not_null

      - name: laps_completed
        description: Number of race laps completed.

      - name: status
        description: Final race classification status.

      - name: race_winner
        description: True when the driver won the race.

      - name: started_on_pole
        description: True when the driver started from pole.

      - name: scored_points
        description: True when the driver scored championship points.